name: Build

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

permissions:
  contents: read

jobs:
  build:
    name: JDK 21 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build on Linux
        if: runner.os != 'Windows'
        run: ./gradlew buildAll --no-daemon

      - name: Build on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat buildAll --no-daemon
